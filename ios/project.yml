name: TailTuneRemote
options:
  bundleIdPrefix: dev.tailtune
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  TailTuneRemote:
    type: application
    platform: iOS
    sources:
      - TailTuneRemote/Sources
    info:
      path: TailTuneRemote/Info.plist
      properties:
        CFBundleDisplayName: TailTune
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: TailTune finds and controls your music player on the local network.
        NSBonjourServices:
          - _tailtune._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tailtune.remote.ios
        PRODUCT_NAME: TailTune
        MARKETING_VERSION: 0.6.0
        CURRENT_PROJECT_VERSION: 6
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - TailTuneRemoteTests
  TailTuneRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TailTuneRemoteTests
    dependencies:
      - target: TailTuneRemote
