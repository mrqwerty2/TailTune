name: Android quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Host-independent architecture/fault checks
        run: |
          python3 tools/static_audit.py
          python3 tools/fault_simulation.py --trials 1000 --steps 200 --output verification/ci-fault-simulation.json
          python3 tools/cache_fault_simulation.py --trials 1000 --steps 200 --output verification/ci-cache-simulation.json

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit test, lint and build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TailTune-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TailTune-android-verification
          path: |
            verification/*.json
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
